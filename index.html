<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
<h1>My Calculator </h1>
<div class="Calculator">
    <input id="screen" value="0" type="text" readonly>
<div class="grille-boutons"> 
<div class="rightcontainer">
<button>⌫</button>
<button  >CE</button>
<button >&plus;</button>
<button >&minus;</button>
<button  >&times;</button>
<button  >&divide;</button>
</div>

<div class="centercontainer">
<button >7</button>
<button >8</button>
<button  >9</button>
<button  >4</button>
<button  >5</button>
<button  >6</button>
<button >1</button>
<button >2</button>
<button  >3</button>
<button  >0</button>
<button  >.</button>
<button  >%</button>
</div>


<div class="leftcontainer">
<button >(</button>
<button >)</button>
<button  >sin</button>
<button  >cos</button>
<button  >tan</button>
<button  >√</button>
</div>

    <button class="leftequal" >=</button>
    <button class="rightequal">=</button>

</div>
</div>




    <script src="script.js"></script>
</body>
</html>
